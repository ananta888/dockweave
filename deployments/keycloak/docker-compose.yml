services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: dockweave-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --http-port 8080
    environment:
      # No default password: scripts/keycloak-up.sh generates one into
      # ~/.config/dockweave/keycloak.env (0600) and exports it.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD (use scripts/keycloak-up.sh)}
    ports:
      # Loopback only. Agent containers reach the host through the Docker
      # bridge, and the admin console / master realm must never be
      # reachable from them or the network. LAN access goes through the
      # TLS proxy (deployments/lan-access), which exposes only the login flow.
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./realm-dockweave.json:/opt/keycloak/data/import/realm-dockweave.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/dockweave/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  keycloak-data:
