name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test-wrapper
      - run: python3 -m pip install jsonschema==4.26.0
      - run: python3 -B scripts/validate_todos.py
      - run: python3 -B -m unittest discover -s scripts/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make web
      - run: npx playwright install --with-deps chromium
        working-directory: ui/web
      - run: npm run e2e:pipeline
        working-directory: ui/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pipeline-browser-failure
          path: ui/web/test-results/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Static analysis
        run: |
          make install-tools
          make lint
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: govulncheck
        # Advisory until fixed docker/docker releases exist: current findings
        # (GO-2026-4883/4887) are Moby daemon-side with no fix available and
        # are not reachable from DockWeave's client-only usage.
        # See docs/security-decisions.md SD-004.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests (privileged)
        run: make test-integration

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, integration, wrapper, web]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Build embedded web assets
        run: make web
      - name: Build binaries
        run: |
          for os in linux; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o dist/dockweave-$os-$arch ./cmd/dockweave
              GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o dist/dockweaved-$os-$arch ./cmd/dockweaved
            done
          done
      - name: SBOM
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          syft . -o spdx-json > dist/sbom.spdx.json
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
