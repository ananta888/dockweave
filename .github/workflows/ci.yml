name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: govulncheck
        # Advisory until fixed docker/docker releases exist: current findings
        # (GO-2026-4883/4887) are Moby daemon-side with no fix available and
        # are not reachable from DockWeave's client-only usage.
        # See docs/security-decisions.md SD-004.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests (privileged)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /src \
            golang:1.27 \
            bash -c "go test -tags integration -v ./tests/integration/..."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, integration]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build binaries
        run: |
          for os in linux; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o dist/dockweave-$os-$arch ./cmd/dockweave
              GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o dist/dockweaved-$os-$arch ./cmd/dockweaved
            done
          done
      - name: SBOM
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          syft . -o spdx-json > dist/sbom.spdx.json
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
