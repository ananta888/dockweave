openapi: 3.1.0
info:
  title: DockWeave Management API
  version: v1
  description: |
    Versioned REST API for DockWeave agent/workspace/mount management.
    Served over a Unix domain socket with SO_PEERCRED authentication.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause

paths:
  /api/v1/health:
    get:
      summary: Daemon health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  time: { type: string, format: date-time }

  /api/v1/agents:
    get:
      summary: List agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
    post:
      summary: Create an agent identity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSpec" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agents/{id}:
    get:
      summary: Get agent by ID or name
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove an agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: prune, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Removed }

  /api/v1/agents/{id}/start:
    post:
      summary: Start (or create) the agent container
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }

  /api/v1/agents/{id}/stop:
    post:
      summary: Stop the agent container
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Stopped }

  /api/v1/agents/{id}/restart:
    post:
      summary: Restart the agent
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Restarted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }

  /api/v1/workspaces:
    get:
      summary: List workspaces
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
    post:
      summary: Register a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                path: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }

  /api/v1/workspaces/{id}:
    delete:
      summary: Unregister a workspace (active grants must be revoked first)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Unregistered }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/grants:
    get:
      summary: List grants
      parameters:
        - { name: workspace, in: query, schema: { type: string } }
        - { name: agent, in: query, schema: { type: string } }
      responses:
        "200":
          description: Grant list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Grant" }
    post:
      summary: Create a grant and apply the mount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace: { type: string }
                agent: { type: string }
                mode: { type: string, enum: [ro, rw] }
                exclusive: { type: boolean }
                ttl: { type: string, example: 2h }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/grants/{id}:
    delete:
      summary: Revoke a grant and unmount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: force, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Revoked }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/mounts:
    get:
      summary: List mount states
      parameters:
        - { name: agent, in: query, schema: { type: string } }
      responses:
        "200":
          description: Mount list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MountState" }

  /api/v1/activity:
    get:
      summary: Live agent activity snapshot
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentActivity" }

  /api/v1/conflicts:
    get:
      summary: Multi-agent file conflicts
      responses:
        "200":
          description: Conflict list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FileConflict" }

  /api/v1/live:
    get:
      summary: Work in flight (endpoint jobs, gate runs)
      description: >
        In-memory list of work the daemon is executing right now; entries
        disappear when the request finishes and are lost on restart. Requests
        refused by pipeline admission never appear. Read-only (admin, monitor).
      responses:
        "200":
          description: Live work
          content:
            application/json:
              schema:
                type: object
                required: [items, now]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LiveWork" }
                  now: { type: string, format: date-time }

  /api/v1/tickets:
    get:
      summary: List tickets of the primary provider (ADR 0003)
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "comma-separated canonical statuses" }
        - { name: assignee, in: query, schema: { type: string }, description: "agent:<id|name> or human:<id>" }
        - { name: parent, in: query, schema: { type: string }, description: "ticket ref or id" }
        - { name: q, in: query, schema: { type: string } }
        - { name: updated_since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 1000 } }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: object
                required: [provider, tickets]
                properties:
                  provider: { type: string }
                  tickets: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }
    post:
      summary: Create a ticket (audited as ticket.created)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTicket" }
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "id or <provider>:<id> of the primary provider" }
    get:
      summary: Get a ticket
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }
    delete:
      summary: Delete a ticket (permission ticket.delete; a parent with children is 409; audited ticket.deleted)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }
    patch:
      summary: Update a ticket (optimistic with expected_version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUpdate" }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Ticket thread (append-only)
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments: { type: array, items: { $ref: "#/components/schemas/TicketComment" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }
    post:
      summary: Add a comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1 }
      responses:
        "201":
          description: Comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketComment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/{id}/checkout:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Claim a ticket for an agent (exclusive; one agent per ticket)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketClaim" }
      responses:
        "200":
          description: Ticket after the claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/{id}/release:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Release a claimed ticket (only the holder)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketClaim" }
      responses:
        "200":
          description: Ticket after the release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/run:
    post:
      summary: Run one dispatcher heartbeat for an agent (ADR 0003 D-4)
      description: >
        Takes the agent's next ticket of the primary provider and runs the
        worker loop: blockers, pipeline admission, claim, pre_run gates, the
        agent turn, STATUS/VERDICT contracts, after_run/post_run gates and
        routing. Refusals spend no model turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              additionalProperties: false
              properties:
                agent: { type: string }
      responses:
        "200":
          description: Outcome of the heartbeat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchOutcome" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/{id}/route:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Retry the pipeline routing of a ticket (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              additionalProperties: false
              properties:
                agent: { type: string, description: "upstream agent" }
      responses:
        "200":
          description: Routing lines (WAKE/REWORK/DENY/ERR)
          content:
            application/json:
              schema:
                type: object
                required: [lines, complete]
                properties:
                  lines: { type: array, items: { type: string } }
                  complete: { type: boolean }
                  error: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/sync:
    get:
      summary: Live sync status (ADR 0003 D-8)
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                required: [configured]
                properties:
                  configured: { type: boolean }
                  hint: { type: string }
                  status: { type: object, description: "primary, mirror, linked, last_pass, last_success, lag_seconds, conflicts_total, last_report" }
    post:
      summary: Run a sync pass now (initial import, dry run)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                initial: { type: boolean }
                dry_run: { type: boolean }
      responses:
        "200":
          description: Pass report
          content:
            application/json:
              schema:
                type: object
                required: [report, complete]
                properties:
                  report: { type: object }
                  complete: { type: boolean }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/TicketingUnavailable" }

  /api/v1/tickets/humans:
    get:
      summary: Humans seen through the web gateway (assignable)
      responses:
        "200":
          description: Known humans, most recently seen first
          content:
            application/json:
              schema:
                type: object
                required: [humans]
                properties:
                  humans:
                    type: array
                    items:
                      type: object
                      required: [id, last_seen]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        groups: { type: array, items: { type: string } }
                        last_seen: { type: string, format: date-time }

  /api/v1/tickets/me:
    get:
      summary: Caller identity, roles and permissions (for the UI; ADR 0003 D-6a)
      responses:
        "200":
          description: Effective access
          content:
            application/json:
              schema:
                type: object
                required: [actor, roles, permissions, source]
                properties:
                  actor: { $ref: "#/components/schemas/TicketActor" }
                  roles: { type: array, items: { type: string } }
                  permissions: { type: array, items: { type: string } }
                  source: { type: string, enum: [groups, peer], description: "groups = forwarded human, peer = socket peer role" }
                  config_error: { type: string, description: "ticket-roles.json invalid; humans are read-only" }

  /api/v1/tickets/provider:
    get:
      summary: Configured ticket provider, mirror, health and capabilities (ADR 0003)
      description: >
        Ticketing is opt-in (TICKET_PROVIDER in dockweaved.conf). Without it,
        or when the provider cannot be opened, `configured` is false and
        `error` says why; no provider is chosen silently. Read-only.
      responses:
        "200":
          description: Provider status
          content:
            application/json:
              schema:
                type: object
                required: [configured, available]
                properties:
                  configured: { type: boolean }
                  available: { type: array, items: { type: string } }
                  error: { type: string }
                  primary: { $ref: "#/components/schemas/TicketProviderStatus" }
                  mirror: { $ref: "#/components/schemas/TicketProviderStatus" }

  /api/v1/events:
    get:
      summary: Recent audit events
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200 } }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }

  /api/v1/events/stream:
    get:
      summary: Stream audit events (Server-Sent Events)
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: {}

  /api/v1/monitor/providers:
    get:
      summary: Monitoring provider availability
      responses:
        "200":
          description: Provider status map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }

  /api/v1/pipelines:
    get:
      summary: Stored gate -> agent pipeline edges (ADR 0002)
      parameters:
        - { name: agent, in: query, description: downstream agent id or name, schema: { type: string } }
      responses:
        "200":
          description: Edge set and the graph revision it came from
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineState" }
    put:
      summary: Replace all edges for a graph revision (admin)
      description: >
        Atomic replacement. Agent ids must exist and workspaces must resolve
        below the allowed roots. An older revision never overwrites a newer
        one (409 stale_revision) unless reset is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, edges]
              properties:
                revision: { type: integer, minimum: 0 }
                reset: { type: boolean }
                edges: { type: array, items: { $ref: "#/components/schemas/PipelineEdge" } }
      responses:
        "200":
          description: Stored state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineState" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            stale_revision for an older revision (unless reset); revision_conflict
            for different content at an existing revision. An identical repeat
            of the stored revision is a 200 no-op.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - properties: { error: { properties: { code: { enum: [stale_revision, revision_conflict] } } } }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/pipelines/admission:
    get:
      summary: May an agent take pipeline work now? (read-only, never consumes overrides)
      parameters:
        - { name: agent, in: query, description: agent id or name; omitted = every agent with edges, schema: { type: string } }
      responses:
        "200":
          description: >
            Admission for one agent; without agent the collection of every
            agent that has incoming edges ({revision, admissions[]}), with an
            empty admissions list when no edges are stored.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Admission" }
                  - { $ref: "#/components/schemas/Admissions" }
        "403": { description: Peer UID not authorized }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Pipeline snapshot unavailable }

  /api/v1/agents/{id}/pipeline:
    get:
      summary: Pipeline admission as agent status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Admission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
        "403": { description: Peer UID not authorized }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/override:
    post:
      summary: Audited admin override for a blocked edge (never for tamper or denied)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, gate_id, reason]
              properties:
                agent: { type: string }
                gate_id: { type: string, description: "gate id or * for every gate of the agent" }
                reason: { type: string, minLength: 3 }
                ttl_sec: { type: integer, default: 900, minimum: 0, maximum: 86400, description: "0 selects the 900-second default" }
                single_use: { type: boolean, default: true }
      responses:
        "200":
          description: Created override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineOverride" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/pipelines/overrides:
    get:
      summary: List pipeline overrides
      parameters:
        - { name: agent, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Overrides
          content:
            application/json:
              schema:
                type: object
                properties:
                  overrides: { type: array, items: { $ref: "#/components/schemas/PipelineOverride" } }

  /api/v1/gates/prune:
    post:
      summary: Delete old gate runs (retention, admin)
      description: >
        Ranges are checked before any duration arithmetic. Runs newer than
        `days` and the newest `keep_per_workspace` runs of every workspace are
        always kept; ordering uses started_at then id (newest first).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer, minimum: 0, maximum: 36500, default: 30, description: "0 selects the 30-day default" }
                keep_per_workspace: { type: integer, minimum: 0, maximum: 100000, default: 20, description: "0 selects the default of 20" }
      responses:
        "200":
          description: Number of deleted runs
          content:
            application/json:
              schema:
                type: object
                required: [pruned]
                properties:
                  pruned: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/chat/completions:
    post:
      summary: OpenAI-compatible prompt to an agent (see docs/openai-endpoint.md)
      description: >
        Before the agent is driven the pipeline admission is enforced. A
        blocked agent receives 409 with error.code = pipeline_blocked; nothing
        is sent to the agent.
      parameters:
        - { name: X-DockWeave-Issue, in: header, description: optional issue id for the audit trail, schema: { type: string } }
      responses:
        "200": { description: chat.completion (or SSE stream) }
        "409":
          description: Pipeline blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineBlocked" }

components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Validation error (error.code = invalid)
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Error" }
              - properties: { error: { properties: { code: { const: invalid } } } }
    Forbidden:
      description: >
        Not an admin peer. A handler-level refusal is JSON (error.code =
        forbidden); the peer-auth middleware refuses unknown UIDs and monitor
        writes earlier with a text/plain body.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Error" }
              - properties: { error: { properties: { code: { const: forbidden } } } }
        text/plain:
          schema: { type: string }
    PermissionDenied:
      description: A forwarded human lacks a permission (ADR 0003 D-6a)
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Error" }
              - type: object
                required: [permission]
                properties: { permission: { type: string } }
    TicketingUnavailable:
      description: No ticket provider configured, or the provider is unreachable (error.code = ticketing_unavailable); fail closed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unsupported:
      description: The provider lacks this capability (error.code = unsupported)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Persistence or mandatory audit write failed; the mutation was rolled back
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        image: { type: string }
        command: { type: array, items: { type: string } }
        env_file: { type: string }
        agent_ro: { type: boolean }
        uid: { type: integer }
        gid: { type: integer }
        cpu_limit: { type: number }
        memory_mb: { type: integer }
        network_mode: { type: string }
        state: { type: string, enum: [created, running, stopped, exited, error] }
        container_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentSpec:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        type: { type: string, enum: [codex, opencode, claude, gemini, custom] }
        image: { type: string }
        command: { type: array, items: { type: string } }
        env_file: { type: string }
        agent_ro: { type: boolean, default: true }
        uid: { type: integer }
        gid: { type: integer }
        cpu_limit: { type: number }
        memory_mb: { type: integer }
        network_mode: { type: string, enum: [bridge, none], default: bridge }

    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        host_path: { type: string }
        created_at: { type: string, format: date-time }

    Grant:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        agent_id: { type: string }
        mode: { type: string, enum: [ro, rw] }
        exclusive: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        revoked_at: { type: string, format: date-time, nullable: true }

    MountState:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        grant_id: { type: string }
        host_path: { type: string }
        target_path: { type: string }
        mode: { type: string, enum: [ro, rw] }
        status: { type: string, enum: [desired, mounted, failed, gone] }
        last_error: { type: string }
        updated_at: { type: string, format: date-time }

    AgentActivity:
      type: object
      properties:
        agent_id: { type: string }
        state: { type: string }
        activity: { type: string, enum: [UNKNOWN, IDLE, READING, WRITING] }
        cpu_percent: { type: number }
        memory_bytes: { type: integer }
        workspace: { type: string }
        open_files: { type: array, items: { type: string } }
        processes: { type: integer }
        available: { type: boolean }
        unavailable_reason: { type: string }
        timestamp: { type: string, format: date-time }

    FileConflict:
      type: object
      properties:
        path: { type: string }
        agent_ids: { type: array, items: { type: string } }
        writers: { type: array, items: { type: string } }
        detected_at: { type: string, format: date-time }

    TicketActor:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [human, agent, system] }
        id: { type: string }
        name: { type: string }
    TicketRef:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string }
        id: { type: string }
    Ticket:
      type: object
      required: [ref, title, status, created_at, updated_at, version]
      properties:
        ref: { $ref: "#/components/schemas/TicketRef" }
        identifier: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [backlog, todo, in_progress, in_review, blocked, done, cancelled] }
        priority: { type: string, enum: [critical, high, medium, low] }
        assignee: { $ref: "#/components/schemas/TicketActor" }
        parent: { $ref: "#/components/schemas/TicketRef" }
        blocked_by: { type: array, items: { $ref: "#/components/schemas/TicketRef" } }
        workspace_id: { type: string }
        created_by: { $ref: "#/components/schemas/TicketActor" }
        checked_out_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: string }
        extra: { type: object, description: "provider fields without canonical meaning (read-only)" }
    NewTicket:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, enum: [backlog, todo, in_progress, in_review, blocked, done, cancelled] }
        priority: { type: string, enum: [critical, high, medium, low] }
        assignee: { $ref: "#/components/schemas/TicketActor" }
        parent: { $ref: "#/components/schemas/TicketRef" }
        blocked_by: { type: array, items: { $ref: "#/components/schemas/TicketRef" } }
        workspace_id: { type: string }
    TicketUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, enum: [backlog, todo, in_progress, in_review, blocked, done, cancelled] }
        priority: { type: string, enum: [critical, high, medium, low] }
        assignee: { $ref: "#/components/schemas/TicketActor" }
        clear_assignee: { type: boolean }
        blocked_by: { type: array, items: { $ref: "#/components/schemas/TicketRef" } }
        workspace_id: { type: string, description: "workspace id or name; empty clears" }
        expected_version: { type: string }
    TicketComment:
      type: object
      required: [id, ticket, author, body, created_at]
      properties:
        id: { type: string }
        ticket: { $ref: "#/components/schemas/TicketRef" }
        author: { $ref: "#/components/schemas/TicketActor" }
        body: { type: string }
        created_at: { type: string, format: date-time }
        origin: { type: string }
    TicketClaim:
      type: object
      required: [agent]
      additionalProperties: false
      properties:
        agent: { type: string, description: "DockWeave agent id or name" }

    DispatchOutcome:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [idle, waiting, blocked, busy, pre_run_failed, agent_failed, ran] }
        ticket: { $ref: "#/components/schemas/TicketRef" }
        status: { type: string, enum: [backlog, todo, in_progress, in_review, blocked, done, cancelled] }
        detail: { type: string }

    TicketProviderStatus:
      type: object
      required: [name, health, capabilities]
      properties:
        name: { type: string, enum: [native, paperclip] }
        health:
          type: object
          required: [ok, checked]
          properties:
            ok: { type: boolean }
            detail: { type: string }
            checked: { type: string, format: date-time }
        capabilities:
          type: object
          properties:
            threads: { type: boolean }
            inbox: { type: boolean }
            children: { type: boolean }
            approvals: { type: boolean }
            wake: { type: boolean }
            authorship: { type: boolean }
            workspaces: { type: boolean }
            human_assignee: { type: boolean }
            delete: { type: boolean }

    LiveWork:
      type: object
      required: [id, kind, started_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [endpoint_job, gate_run] }
        agent_id: { type: string, description: "Agent driven by an endpoint job (stable ID)" }
        upstream_agent_id: { type: string, description: "Agent whose work a gate run checks (stable ID)" }
        workspace: { type: string }
        issue_id: { type: string }
        started_at: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        actor: { type: string }
        agent_id: { type: string }
        workspace_id: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        prev_hash: { type: string }
        hash: { type: string }

    PipelineEdge:
      type: object
      required: [gate_id, downstream_agent_id, workspace]
      properties:
        id: { type: string }
        gate_id: { type: string }
        upstream_agent_id: { type: string }
        downstream_agent_id: { type: string }
        workspace: { type: string, description: canonical absolute path }
        on_true: { type: string, description: "allow | deny | wake:<agent-id> | rework" }
        on_false: { type: string, enum: [deny, rework], description: "deny (default) | rework; a failing gate never admits work (ADR 0002 D-2)" }
        reason_true: { type: string }
        reason_false: { type: string }
        max_age_sec: { type: integer, minimum: 0, maximum: 315360000, description: "0 disables age expiry. Completion must be present, no earlier than start and no more than 60 seconds in the future." }
        source_revision: { type: integer }
        updated_at: { type: string, format: date-time }

    PipelineState:
      type: object
      properties:
        revision: { type: integer }
        updated_at: { type: string, format: date-time }
        edges: { type: array, items: { $ref: "#/components/schemas/PipelineEdge" } }

    AdmissionEdge:
      type: object
      required: [edge_id, gate_id, workspace, satisfied, code, action]
      properties:
        edge_id: { type: string }
        gate_id: { type: string }
        upstream_agent_id: { type: string }
        workspace: { type: string }
        satisfied: { type: boolean }
        code:
          type: string
          enum: [ok, override, no_run, failed, error, stale, expired, tamper, fingerprint_unavailable, unknown_gate, denied, internal]
        message: { type: string }
        run_id: { type: string }
        run_status: { type: string }
        run_finished_at: { type: string, format: date-time }
        action: { type: string }
        reason: { type: string }
        override_id: { type: string }

    Admission:
      type: object
      required: [agent_id, allowed, action, edges, revision, checked_at]
      properties:
        agent_id: { type: string }
        agent: { type: string }
        allowed: { type: boolean }
        action: { type: string, description: "allow | wake:<agent> when allowed; deny | rework when blocked" }
        reason: { type: string, description: "verdict reason (reason_true/reason_false) of the edge that determined the action" }
        edges: { type: array, items: { $ref: "#/components/schemas/AdmissionEdge" } }
        revision: { type: integer }
        checked_at: { type: string, format: date-time }
        fingerprints: { type: object, additionalProperties: { type: string } }

    Admissions:
      type: object
      required: [revision, admissions]
      properties:
        revision: { type: integer, description: Revision of the single edge snapshot used for all admissions }
        admissions: { type: array, items: { $ref: "#/components/schemas/Admission" } }

    PipelineOverride:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        gate_id: { type: string }
        reason: { type: string }
        actor: { type: string }
        single_use: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time }

    PipelineBlocked:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string, enum: [pipeline_blocked] }
            code: { type: string, enum: [pipeline_blocked] }
            gate_id: { type: string }
            action: { type: string }
            reasons: { type: array, items: { $ref: "#/components/schemas/AdmissionEdge" } }
        admission: { $ref: "#/components/schemas/Admission" }
